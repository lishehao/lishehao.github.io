name: Build Hugo Site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.153.3'
          extended: true

      - name: Build
        run: hugo --gc --minify --destination public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Build and test gallery homepage
        run: |
          npm ci --prefix portfolio
          npm test --prefix portfolio
          npm run build --prefix portfolio
          node portfolio/publish.mjs public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public
